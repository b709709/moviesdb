<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <script src="{{url_for('static',filename='js/jquery.js')}}"></script>    
        <link rel="stylesheet" href="{{url_for('static',filename='css/bootstrap.min.css')}}">
        <link rel="stylesheet" href="{{url_for('static',filename='css/global.css')}}">
    </head>

    <body>
        <div class="dash-header">
          <h1>🎭 Actors</h1>
          <div class="dash-right dash-user" >ID:{{username}}
            <a id="btnlogout" href="/logout" class="btn btn-danger">Logout</a>
          </div>
        </div>
        
        <div class="d-flex xflex-column xflex-md-row justify-content-between align-items-start align-items-center mb-1 p-2 bg-light border rounded">
         <div class="d-flex xflex-column xflex-md-row">
           
           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/dashboard">🏠
             <span class="d-none d-sm-inline">Home</span></a>
           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/movies?svc=services.dbproc&func=get_movies">🎞️
             <span class="d-none d-sm-inline">Movies</span></a>
           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/studios?svc=services.dbproc&func=get_studios">🎬
             <span class="d-none d-sm-inline">Studios</span></a>

           
         </div>
        </div>

        <!--bootstrap navbar BEGIN -->

        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <div class="container-fluid">
             <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
               <span class="navbar-toggler-icon"></span>
             </button>

             <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-0 mb-lg-0">
                    <li class="nav-item">
                        
                        <form class="d-flex align-items-center" method="GET" action="/actor?svc=services.dbproc&func=get_actors">
                            <input type="hidden" name="svc" value="services.dbproc">
                            <input type="hidden" name="func" value="get_actors">
                            
                            <input id="searchInput" name="searchInput" 
                                    placeholder="Search Actor * for Wildcard" 
                                    type="search" class="form-control me-0">
                            <button class="btn btn-primary me-2" type="submit" id="searchButton">Search</button>
                        
                        </form>
                        
                    </li>
                    
                    <li class="nav-item">
                        <div class="btn-group me-2">
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">➕
                                <span class="d-none d-sm-inline">Add Actor</span></button>
                            <a type="button" href="/actor?svc=services.dbproc&func=get_actors" class="btn btn-secondary" id="resetview">↺
                            <span class="d-none d-sm-inline">Reset</span></a>    
                        </div>
                    </li>
                    
                </ul>
             </div>
            </div>
        </nav>

        <!--bootstrap navbar END -->
        <!--bootstrap sticky table BEGIN -->
        <div style="max-height:80%; overflow-y:auto;">
            <table class="table table-hover table-responsive table-secondary table-striped table-hover table-bordered ">
                <thead class="sticky-top table-light">
                    <tr>
                        <th>Actor Name({{recordcount}})</th>
                        <th>Birth Year</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tablebody">
                    {% for datarow in data %}
                     <tr class="table-row" id="actor-{{datarow.id}}">
                        <td class="actor-name" style="width:50%" >{{datarow.name}}</td>
                        <td class="actor-year" style="width:15%" >{{datarow.birthyear}}</td>
                        <td class="actions" style="width:35%">
                            <span title="Edit Current Record" class="edit-icon btnEdit" data-bs-toggle="modal" data-bs-target="#editModal"
                            data-actorid = "{{datarow.id}}"
                            data-actorname = "{{datarow.name}}"
                            data-birthyear = "{{datarow.birthyear}}"
                            onclick="openEditModal(this)"
                            >✏️</span>
                            <span data-actorid = "{{datarow.id}}" title="Delete Current Record" class="delete-icon btnDelete">
                            🗑️
                            </span>
                        </td>
                     </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
        <!-- bootstrap sticky table end -->

        <div id="alertPlaceholder"></div>
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>


        <div id="editModal" class="modal fade" tab-index="-1">
           <div class="modal-dialog">
            <div class="modal-content">
                <!--HEADER-->    
                <div class="modal-header">
                   <h3>Edit Actor</h3>
                   <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Actor Name</label>
                        <input type="text" class="form-control" id="edit-name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Birth Year</label>
                        <input type="number" class="form-control" id="edit-year">
                    </div>
                </div>
                <!--BODY-->
                <div class="modal-footer">
                    <button type="btn-save" class="btn btn-primary" id="save-edit">Save</button>
                    <button type="btn-close" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
                <!--FOOTER-->
            </div> <!--modal-content-->
           </div> <!--modal-dialog-->
        </div> <!-- editModal container-->

        <div id="addModal" class="modal fade" tab-index="-1">
         <div class="modal-dialog">
          <div class="modal-content">  

           <div class="modal-header">
                <h5 class="modal-title">Add Actor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
           </div>

           <div class="modal-body">
               <div class="mb-3">
                <label class="form-label">Actor Name</label>
                <input type="text" class="form-control" id="new-name">
               </div>
               <div class="mb-3">
                <label class="form-label">Birth Year</label>
                <input type="number" class="form-control" id="new-birthyear">
               </div>
            </div>

            <div class="modal-footer">
             <button type="submit" class="btn btn-primary" id="save-actor">Save</button>
             <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
           </div> <!--modal footer-->

          </div> <!--modal content-->
         </div> <!--modal dialog-->
        </div> <!--addModal container-->
       

    <script>
        function openEditModal(ele){
            const actorid = ele.dataset.actorid;
            const birthyear = ele.dataset.birthyear;
            const actorname = ele.dataset.actorname;

            document.getElementById("edit-name").value = actorname;
            document.getElementById("edit-year").value = birthyear;
            document.getElementById("save-edit").dataset.actorid = actorid;

        }
        document.getElementById("save-edit").onclick = async function() {
            const modalEl = document.getElementById("editModal");
            const modal = bootstrap.Modal.getInstance(modalEl)

            const actorid = document.getElementById("save-edit").dataset.actorid;
            const actorname = document.getElementById("edit-name").value;
            const actoryear = document.getElementById("edit-year").value;

            const response = await fetch("/api/edit?svc=api.actor&func=editActor",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({actorname,actoryear,actorid})
                
            });

            if (response.ok) {
                sactorrow = "actor-" + actorid;
                gridrow = document.getElementById(sactorrow);
                gridrow.querySelector(".actor-name").textContent = actorname;
                gridrow.querySelector(".actor-year").textContent = actoryear;
                editicon = gridrow.querySelector(".edit-icon");
                editicon.dataset.actorname = actorname;
                editicon.dataset.actoryear = actoryear;
                modal.hide();

            }
            else {
                alert("Save Failed, Please retry.");
            }



        }

        function showToast(message, type = "success") {
            // Bootstrap color mapping
            const typeClass = {
                success: "text-bg-success",
                danger: "text-bg-danger",
                warning: "text-bg-warning",
                info: "text-bg-info"
            }[type] || "text-bg-primary";

            // Create wrapper
            const wrapper = document.createElement("div");
            wrapper.innerHTML = `
                <div class="toast align-items-center ${typeClass} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;

            // Add to container
            const container = document.getElementById("toastContainer");
            container.append(wrapper);

            // Activate toast
            const toastElement = wrapper.querySelector(".toast");
            const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
            toast.show();

            // Remove from DOM after hidden
            toastElement.addEventListener("hidden.bs.toast", () => {
                wrapper.remove();
            });
}

    </script>
    <script>

        addModal.addEventListener('shown.bs.modal', () => {
            document.getElementById('new-name').value = '';
            document.getElementById('new-birthyear').value = 0;
        });
        addModal.addEventListener('shown.bs.modal', () => {
            document.getElementById('new-name').focus();
        });

    </script>

    
    <script src="{{url_for('static',filename='js/bootstrap.bundle.min.js')}}"></script>    
    <script src="{{url_for('static',filename='js/global.js')}}"></script>
