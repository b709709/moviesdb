<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <script src="{{url_for('static',filename='js/jquery.js')}}"></script>
        <link rel="stylesheet" href="{{url_for('static',filename='css/bootstrap.min.css')}}">
        <link rel="stylesheet" href="{{url_for('static',filename='css/global.css')}}">
    </head>

    <body>
        <div class="dash-header">
            <h1>🎬Studios</h1>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-center mb-1 p-2 bg-light border rounded">
         <div class="d-flex flex-column flex-md-row">

           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/dashboard">
            🏠<span class="d-none d-sm-inline">Home</span></a>
           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/actors?svc=services.dbproc&func=get_actors">
            🎭<span class="d-none d-sm-inline">Actors</span></a>
           <a class="btn btn-primary btn-space me-2 mb-1 mb-sm-1 mb-md-0" href="/studios?svc=services.dbproc&func=get_movies">
            🎞️<span class="d-none d-sm-inline">Movies</span></a>

           
         </div>
        </div>

        <!-- TOOLBAR START -->
         <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-2 mb-2 p-2 bg-light border rounded">

            <form class="d-flex flex-grow-1 m-0" method="GET" action="/studios?svc=services.dbproc&func=get_studios">
                <input type="hidden" name="svc" value="services.dbproc"> <!-- needed for query string -->
                <input type="hidden" name="func" value="get_studios">

                <div class="input-group w-100">
                    <span class="input-group-text">Search</span>
                    <input type="text" id="searchInput" name="searchInput" class="form-control" placeholder="Studio Name * for Wildcard">
                </div>
                <div class="input-group w-100">
                    <button  type="submit" class="btn btn-primary" id="searchButton">Go</button>
                </div>
                
            </form>

            <div class="d-flex gap-2">
                <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addModal">➕
                    <span class="d-none d-sm-inline">Add Studio</span></button>
                <a href="/studio?svc=services.dbproc&func=get_studios" class="btn btn-secondary" id="resetview">↺
                    <span class="d-none d-sm-inline">Reset</span></a>
            </div>

        </div>
        <!-- TOOLBAR END -->
         
        <div class="data-list">
            <div class="data-row-header">
                <div><a>Studio Name ({{recordcount}})</a></div>
                <div><span titla="Add New Studio" class="add-icon" data-bs-toggle="modal" data-bs-target="#addModal">➕</span></div>
            </div>
            {% for datarow in data %}
            <div class="data-row" id="studio-{{datarow.id}}">
                <div class="studio-name">{{datarow.name}}</div>
                  <div class="actions">
                    <span title="Edit Current Record" class="edit-icon btnEdit" data-bs-toggle="modal" data-bs-target="#editModal"
                            data-studioid = "{{datarow.id}}"
                            data-studioname = "{{datarow.name}}"
                            onclick="openEditModal(this)"
                            >✏️</span>
                        <span data-studioid = "{{datarow.id}}" id="btnDelete" title="Delete Current Record" class="delete-icon btnDelete">
                            🗑️
                        </span>
                  </div>
            </div>
            {% endfor %}
        </div>
        

    <div id="addModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Studio</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Studio Name</label>
                        <input type="text" class="form-control" name="studioName" id="studioName">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btnSaveNew">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                 <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>    
              <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Studio Name</label>
                    <input class="form-control" type="text" id="edit-name" name="edit-name"/>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveEdit" dataset-studioid="0">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
        </div>
    </div>
    <!-- BEGIN logic for deleting a studio record -->
    <script>
          $(document).on("click",".btnDelete",async function() {
             //confirm box to delete record
             
             if (confirm("Are you sure you want to delete this record") == true)
             {
                //confirmed the deletion
             }
             else {
                return;
             }

             const studioid = this.dataset.studioid;
             let ele = document.getElementById("studio-" + studioid);
             

             const response = await fetch("api/actor?svc=api.studio&func=delStudio",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({"studioid":studioid})
             });

             const responsedata = await response.json();
             if (response.ok && responsedata.status == true)
             {
                
                if (ele){
                    ele.remove();
                }
             }
             else {
                console.log("failed to delete" + responsedata.msg)
             }

          });
    </script>
    <!--END logic for deleting a studio record -->

    <!-- btnEdit logic for editing a studio record BEGIN -->
    <script>
        const editModal = document.getElementById('editModal');
            editModal.addEventListener('shown.bs.modal', () => {

            document.getElementById('edit-name').focus();
            });
             
        $("#saveEdit").on("click",async function(){
             const studioname = document.getElementById("edit-name").value;
             const studioid = this.dataset.studioid;

             const response = await fetch("api/studio?svc=api.studio&func=saveEdit",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body : JSON.stringify({"studioid":studioid,"studioname":studioname})
                });
             const responsedata = await response.json();
             if (response.ok && responsedata.status == true){
                console.log(responsedata.msg);
                const datarow = document.getElementById("studio-" + studioid);
                const col = datarow.querySelector(".studio-name");
                const action = datarow.querySelector(".actions .btnEdit");
                col.innerText = studioname;
                action.dataset.studioname = studioname;
                   
             }
             else {
                console.log("Error in processing the save edit, please refresh and retry" + responsedata.msg);
             }

             const modalEl = document.getElementById("editModal");
             const modal = bootstrap.Modal.getInstance(modalEl);  //always get the instance of the modal box, it's instance is created by bootstrap
             modal.hide();

            });

        function openEditModal(ele){
            studioid = ele.dataset.studioid;
            studioname = ele.dataset.studioname;

            const editModal = document.getElementById("editModal");
            editModal.querySelector("#edit-name").value = studioname;
            editModal.querySelector("#saveEdit").dataset.studioid = studioid;

            //set the fields to blank

        }
    </script>
    <!-- btnEdit logic for editing a studio record END -->

    <!-- btnSaveNew logic for adding a new studio -->
    <script>
        const addModal = document.getElementById('addModal');
             addModal.addEventListener('shown.bs.modal', () => {
                document.getElementById('studioName').value = '';
             });
             addModal.addEventListener('shown.bs.modal', () => {
                document.getElementById('studioName').focus();
                
             });

        document.getElementById("btnSaveNew").onclick = async function(){
             const studioname = document.getElementById("studioName").value;
             console.log(studioname);
             const response = await fetch("/api/studio?svc=api.studio&func=addNew",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({"studioname":studioname})
             },);
             responsedata = await response.json();
             if (response.ok && responsedata.status == true){
                //add the record to the grid
                //create row element and add components
                console.log(responsedata);
                const modalEl = document.getElementById('addModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                addStudioToGrid(responsedata);
             }
             else {
                console.log(responsedata.msg);
                console.log("failed server response");
             }
             

        };

        function addStudioToGrid(studiodata){
            console.log(studiodata);
            
            const row = document.createElement("div");
            row.className = "data-row";
            row.id = "studio-" + studiodata["data"]["id"];


            row.innerHTML = `
                <div class="studio-name">${studiodata["data"]["name"]}</div>
                
                <div class="actions">
                   <span data-studioid="${studiodata["data"]["id"]}" 
                         
                         data-studioname="${studiodata["data"]["name"]}"
                         data-bs-toggle="modal" data-bs-target="#editModal"
                         onclick="openEditModal(this)"
                         class="edit-icon btnEdit"
                      onclick="">✏️</span>
                   <span data-studioid="${studiodata["data"]["id"]}"  class="delete-icon btnDelete"
                      >🗑️</span>
                </div>
            `;
            document.querySelector(".data-list").appendChild(row);
        }
    </script>

    <script src="{{url_for('static',filename='js/bootstrap.bundle.min.js')}}"></script>    
    </body>
</html>
