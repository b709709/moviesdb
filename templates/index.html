<html>
    <head>
     <meta name="viewport" content="width=device-width,initial-scale=1">
     <link rel="stylesheet" href="{{ url_for('static',filename='css/bootstrap.min.css')}}">
     <link rel="stylesheet" href="{{ url_for('static',filename='css/global.css')}}">
    </head>
    <body>
        
                
        <div class="d-flex justify-content-center align-items-center" style="height:100vh;">
            <div id="loginbox" class="shadow p-4 bg-white rounded border border-seconday">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                {% endwith %}
                <h3 class="mb-3 mt-0">Movies Database Login:</h3>
                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter the username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter the password">
                    </div>
                    <div class="text-center">
                        <button type="submit" name="action" value="login" class="btn btn-primary">Login</button>
                        <button type="submit" name="action" value="signup" class="btn btn-primary">Signup</button>
                    </div>
                </form>
            </div>
        </div>
    <script src="{{url_for('static',filename='js/boostrap.bundle.min.js')}}"></script>
    </body>
</html>
